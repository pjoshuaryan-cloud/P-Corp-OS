<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="On set">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>On set</title>
<style>
  :root {
    --bg: #101215; --panel: #1b1e24; --panel-2: #262a33; --line: #323844; --text: #f2f4f7; --muted: #a2aab8;
    --accent: #3fc1b0; --accent-ink: #06201c; --warn: #f0b24d; --warn-ink: #2a1a02; --bad: #ef7a6d; --bad-ink: #2a0906; --good: #62c98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .titlerow { display: flex; align-items: baseline; gap: 10px; }
  h1 { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #net { flex: none; font-size: 12.5px; font-weight: 600; color: var(--good); }
  #net.off { color: var(--warn); }
  .sub { color: var(--muted); font-size: 13px; }
  .track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 8px 0 5px; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #count { font-size: 14px; font-variant-numeric: tabular-nums; }
  #count b { color: var(--bad); font-weight: 700; }
  #count.clear b { color: var(--good); }
  #alerts:empty, #moreAlerts:empty { display: none; }
  #alerts { margin-top: 8px; }
  #moreAlerts { display: grid; gap: 6px; padding: 12px 16px 0; }
  .alert { border-radius: 8px; padding: 8px 11px; font-size: 14.5px; font-weight: 600; }
  .alert.now { background: var(--bad); color: var(--bad-ink); }
  .alert.soon { background: var(--warn); color: var(--warn-ink); }
  .alert.passed { background: var(--panel-2); color: var(--text); font-weight: 500; font-size: 13.5px; }
  .filters { display: flex; gap: 6px; padding: 12px 16px 2px; }
  .filters button { flex: 1; min-height: 38px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 650; }
  main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .moment { display: flex; align-items: baseline; gap: 8px; margin: 20px 0 6px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .moment .time { font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .shot { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; }
  .tick { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 13px 12px; min-height: 60px; }
  .box { flex: none; width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 7px; margin-top: 1px; display: grid; place-items: center; }
  .box svg { display: none; width: 18px; height: 18px; }
  .done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .done .box svg { display: block; }
  .words { min-width: 0; overflow-wrap: anywhere; }
  .what { font-size: 16px; }
  .must .what { font-weight: 650; }
  .done .what { color: var(--muted); font-weight: 400; text-decoration: line-through; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .by { color: var(--good); font-size: 13px; margin-top: 3px; }
  .waiting { color: var(--warn); }
  .notebtn { flex: none; align-self: stretch; min-width: 56px; background: none; border: 0; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 0 10px; }
  .empty { color: var(--muted); text-align: center; padding: 36px 10px; }
  #say { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  #sayText { flex: 1; min-width: 0; height: 48px; padding: 0 13px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; }
  #sayText::placeholder { color: var(--muted); }
  #mic { flex: none; width: 56px; height: 48px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; display: grid; place-items: center; }
  #mic.listening { background: var(--bad); color: var(--bad-ink); }
  #mic svg { width: 24px; height: 24px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: calc(100vw - 28px); max-width: 480px; }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  dialog input[type=text] { width: 100%; height: 46px; padding: 0 12px; margin-bottom: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .actions button, .chips button { min-height: 44px; padding: 0 16px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .actions button:disabled { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .match { display: flex; gap: 11px; align-items: flex-start; padding: 11px 2px; border-top: 1px solid var(--line); }
  .match input { flex: none; width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }
  .match span { min-width: 0; overflow-wrap: anywhere; }
  .match small { display: block; color: var(--muted); font-size: 13px; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 7; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; font-size: 14px; }
  #stopped { padding: 48px 24px; text-align: center; }
  #stopped h2 { font-size: 19px; margin: 0 0 8px; }
  #stopped p { color: var(--muted); margin: 0; }
  @media (prefers-reduced-motion: reduce) { #fill { transition: none; } }
</style>
</head>
<body>
<header id="top" hidden>
  <div class="titlerow"><h1 id="title"></h1><span id="net" role="status"></span></div>
  <div class="sub" id="sub"></div>
  <div class="track"><div id="fill"></div></div>
  <div id="count"></div>
  <div id="alerts" role="status"></div>
</header>
<div id="moreAlerts" role="status"></div>
<div class="filters" id="filters" hidden>
  <button data-filter="all" aria-pressed="true">All</button>
  <button data-filter="left" aria-pressed="false">Still to get</button>
  <button data-filter="mine" aria-pressed="false" id="mineBtn">Mine</button>
</div>
<main id="main"><div class="empty" id="loading">Loading…</div></main>
<form id="say" hidden>
  <input id="sayText" type="text" enterkeyhint="done" autocomplete="off" placeholder="Say or type what you got" aria-label="Say or type what you got">
  <button id="mic" type="button" aria-label="Say what you got" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
  </button>
</form>
<div id="toast" role="status" hidden></div>
<dialog id="whoDialog">
  <h2>Who's shooting?</h2>
  <p>Your name or camera shows next to what you tick.</p>
  <div class="chips" id="whoChips"></div>
  <input id="whoInput" type="text" maxlength="40" autocomplete="off" placeholder="Or type a name" aria-label="Your name or camera">
  <div class="actions"><button id="whoSave" class="primary" type="button">Start</button></div>
</dialog>
<dialog id="noteDialog">
  <h2>Add a note</h2>
  <p id="noteFor"></p>
  <input id="noteInput" type="text" maxlength="200" autocomplete="off" placeholder="Wide only, retake at 3" aria-label="Note">
  <div class="actions"><button id="noteCancel" type="button">Cancel</button><button id="noteSave" class="primary" type="button">Save</button></div>
</dialog>
<dialog id="matchDialog">
  <h2>Tick these?</h2>
  <p id="matchSaid"></p>
  <div id="matchList"></div>
  <div class="actions"><button id="matchCancel" type="button">Cancel</button><button id="matchSave" class="primary" type="button">Tick</button></div>
</dialog>
<script src="on_set_logic.js"></script>
<script src="on_set.js"></script>
</body>
</html>
